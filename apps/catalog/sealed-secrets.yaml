# ==============================================================================
# SEALED SECRETS - secrets chiffrés versionnables dans Git (jalon J2)
# ==============================================================================
# Pour activer : déplacer ce fichier dans apps/children/.
# Alternative acceptée : SOPS (age). Le choix est à justifier dans un ADR.
# Chart sealed-secrets 2.22.0 = contrôleur v0.41.2
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      valuesObject:
        # Nom attendu par défaut par la CLI kubeseal
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # TODO [J2] : sauvegarder la clé privée du contrôleur hors du cluster
  # (sans elle, aucun SealedSecret ne peut être déchiffré après une reconstruction)
