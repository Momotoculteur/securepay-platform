# ==============================================================================
# ARGO ROLLOUTS - canary et rollback automatique (jalon J4)
# ==============================================================================
# Pour activer : déplacer ce fichier dans apps/children/.
# Chart argo-rollouts 2.43.8 = Argo Rollouts v1.10.1
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.8
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
