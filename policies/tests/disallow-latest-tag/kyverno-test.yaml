# Test Kyverno CLI : `kyverno test policies/tests/` (exécuté par la CI)
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-latest-tag
policies:
  - ../../disallow-latest-tag.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Pod
    resources:
      - pod-tag-latest
    result: fail
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Pod
    resources:
      - pod-digest
    result: pass
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    kind: Deployment
    resources:
      - deployment-tag-latest
    result: fail
