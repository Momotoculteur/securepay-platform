[defaults]
inventory = inventory.ini
roles_path = roles
# Vérification des clés d'hôte conservée : récupérez la clé de la VM avec
# ssh-keyscan <IP de la VM> >> ~/.ssh/known_hosts avant le premier lancement
host_key_checking = True
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
